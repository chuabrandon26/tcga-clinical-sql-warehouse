<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-labelledby="t d">
<title id="t">Visual abstract: A clinical data warehouse built from TCGA</title>
<desc id="d">Clinical, exposure and mutation-file metadata for 2,461 patients across five TCGA projects are downloaded from the GDC API, flattened into a keyed SQLite warehouse and queried with joins, CTEs and window functions. Survival differs sharply: 86.3 percent observed deaths in glioblastoma versus 2.0 percent in prostate cancer.</desc>
