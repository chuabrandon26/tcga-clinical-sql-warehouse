<ellipse cx="184.0" cy="238.0" rx="40" ry="9" class="m-cyl top"/>
<text x="184.0" y="266.0" class="m-lab bold" text-anchor="middle">TCGA</text>
<text x="184.0" y="342.0" class="small" text-anchor="middle">Tables joined on case_id</text>
<text x="52.0" y="368.0" class="body">GDC returns deeply nested JSON for</text>
<text x="52.0" y="384.5" class="body">each patient. Flattening it into keyed</text>
<text x="52.0" y="401.0" class="body">tables makes cohort questions</text>
<text x="52.0" y="417.5" class="body">answerable with plain SQL joins</text>
<text x="52.0" y="434.0" class="body">and aggregations.</text>
<rect x="48" y="446" width="272" height="38" rx="8" class="qbox"/>
<circle cx="68" cy="465" r="10" class="qmark"/>
<text x="68.0" y="470.0" class="qmark-t" text-anchor="middle">?</text>
<text x="86.0" y="461.0" class="q">How do survival and mutation burden</text>
<text x="86.0" y="477.0" class="q">differ across five cancer types?</text>
<rect x="352" y="128" width="296" height="368" rx="12" class="panel"/><text x="368.0" y="154.0" class="eyebrow">DATA AND DESIGN</text><text x="368.0" y="176.0" class="h2">Five TCGA projects</text>
<rect x="368" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="222.0" class="num">2,461</text>
<text x="380.0" y="239.0" class="small">patients</text>
<rect x="504" y="192" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="222.0" class="num">3,531</text>
<text x="516.0" y="239.0" class="small">diagnosis records</text>
<rect x="368" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="380.0" y="296.0" class="num">250</text>
<text x="380.0" y="313.0" class="small">MAF files counted</text>
<rect x="504" y="266" width="128" height="66" rx="8" class="statbox"/>
<text x="516.0" y="296.0" class="num">6</text>
<text x="516.0" y="313.0" class="small">relational tables</text>
<text x="368.0" y="362.0" class="body">BRCA, LUAD, COAD, GBM and PRAD,</text>
<text x="368.0" y="378.5" class="body">capped at 500 cases per project and</text>
<text x="368.0" y="395.0" class="body">cached locally from the GDC REST API.</text>
<line x1="368" y1="446" x2="632" y2="446" class="rule"/>
<text x="368.0" y="466.0" class="small">Keys: case_id links every clinical table</text>
<text x="368.0" y="481.0" class="small">Mutation proxy: variant rows per open MAF</text>
<rect x="668" y="128" width="296" height="368" rx="12" class="panel"/><text x="684.0" y="154.0" class="eyebrow">FINDINGS</text><text x="684.0" y="176.0" class="h2">What the queries show</text>
<text x="684.0" y="212.0" class="lab">GBM observed</text>
<text x="684.0" y="227.0" class="lab">deaths</text>
<rect x="848" y="192" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="216.0" class="tval" text-anchor="middle">86.3%</text>
<text x="898.0" y="230.0" class="tsub" text-anchor="middle">17.5 mo average</text>
<text x="684.0" y="264.0" class="lab">PRAD observed</text>
<text x="684.0" y="279.0" class="lab">deaths</text>
<rect x="848" y="244" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="268.0" class="tval" text-anchor="middle">2.0%</text>
<text x="898.0" y="282.0" class="tsub" text-anchor="middle">35.9 mo average</text>
<text x="684.0" y="316.0" class="lab">Highest mutation</text>
<text x="684.0" y="331.0" class="lab">proxy (COAD)</text>
<rect x="848" y="296" width="100" height="46" rx="8" class="tile metric"/>
<text x="898.0" y="320.0" class="tval" text-anchor="middle">41.4</text>
<text x="898.0" y="334.0" class="tsub" text-anchor="middle">variants per MAF</text>
<text x="684.0" y="368.0" class="lab">Kaplan-Meier</text>
<text x="684.0" y="383.0" class="lab">survival curves</text>
<rect x="848" y="348" width="100" height="46" rx="8" class="tile metric"/>
<path class="check" d="M860,371.0 l5,5 l9,-11"/>
<text x="882.0" y="376.0" class="lab">5 types</text>
<text x="684.0" y="418.0" class="body">Stage and treatment fields came back</text>
<text x="684.0" y="434.5" class="body">empty, and the queries expose that gap.</text>
<path class="chev" d="M339,298 l6,6 l-6,6"/>
<path class="chev" d="M655,298 l6,6 l-6,6"/>
