<rect x="0.5" y="0.5" width="999" height="751" rx="18" class="bgcard"/>
<text x="36.0" y="44.0" class="eyebrow">VISUAL ABSTRACT  ·  DATA ENGINEERING  ·  SQL  ·  TCGA CLINICAL DATA</text>
<text x="36.0" y="79.0" class="title">A clinical data warehouse built from TCGA</text>
<text x="36.0" y="106.0" class="sub">Five cancer types pulled from the NIH GDC API into a relational SQLite schema, then explored with nine SQL analyses</text>
<rect x="36" y="128" width="296" height="368" rx="12" class="panel"/><text x="52.0" y="154.0" class="eyebrow">QUESTION</text><text x="52.0" y="176.0" class="h2">From nested JSON to SQL tables</text>
