<text x="36.0" y="650.0" class="eyebrow">TAKE-HOME</text>
<text x="36.0" y="673.0" class="take">Nested GDC records become a <tspan class="em">keyed relational warehouse</tspan>, and nine SQL analyses compare survival, age</text>
<text x="36.0" y="694.0" class="take">and <tspan class="em">mutation burden</tspan> across five cancers, from 86% observed deaths in GBM to 2% in prostate cancer.</text>
